name: Glance
options:
  bundleIdPrefix: com.qishuai
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: D3YFMYLQM5
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Glance:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: QLExtension/Renderers
    dependencies:
      - target: GlanceQL
        copy:
          destination: plugins
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qishuai.glance
        PRODUCT_NAME: Glance
        PRODUCT_MODULE_NAME: Glance
        INFOPLIST_FILE: App/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  GlanceQL:
    type: app-extension
    platform: macOS
    sources:
      - path: QLExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qishuai.glance.QLExtension
        PRODUCT_NAME: GlanceQL
        PRODUCT_MODULE_NAME: GlanceQL
        INFOPLIST_FILE: QLExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: QLExtension/GlanceQL.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
